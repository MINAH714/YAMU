name: yamu-ci

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    init: true
    environment:
      JAVA_OPTS: -Xms256m -Xmx1024m -Duser.timezone=UTC
    ports:
      - "${JENKINS_BIND_IP:?Set the server Tailscale IPv4 in the env file}:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 2g
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/login"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jenkins_home:
