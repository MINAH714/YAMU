location = /status { return 301 /status/; }
location /status/ {
    proxy_pass http://127.0.0.1:13010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    access_log off;
}
# Existing Grafana session cookies use /monitoring/. Keep them scoped there.
location /monitoring/status-api/ {
    limit_req zone=yamu_status_read burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:13010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    client_max_body_size 2k;
    access_log off;
}
