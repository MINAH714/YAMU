# http context only. Generated from route templates; no user values logged.
map $uri $yamu_monitor_route {
    default "/api/other";
    "~^/api/users/me/payment-settings$" "/api/users/me/payment-settings";
    "~^/api/auth/phone-verifications$" "/api/auth/phone-verifications";
    "~^/api/auth/step-up/challenge$" "/api/auth/step-up/challenge";
    "~^/api/accounts/one-won-auth$" "/api/accounts/one-won-auth";
    "~^/api/auth/login/challenge$" "/api/auth/login/challenge";
    "~^/api/accounts/candidates$" "/api/accounts/candidates";
    "~^/api/auth/step-up/verify$" "/api/auth/step-up/verify";
    "~^/api/auth/devices$" "/api/auth/devices";
    "~^/api/auth/refresh$" "/api/auth/refresh";
    "~^/api/cards/lookup$" "/api/cards/lookup";
    "~^/api/auth/logout$" "/api/auth/logout";
    "~^/api/cards/order$" "/api/cards/order";
    "~^/api/auth/login$" "/api/auth/login";
    "~^/api/accounts$" "/api/accounts";
    "~^/api/auth/pin$" "/api/auth/pin";
    "~^/api/users/me$" "/api/users/me";
    "~^/api/health$" "/api/health";
    "~^/api/cards$" "/api/cards";
    "~^/api/auth/phone-verifications/[^/]+/confirm$" "/api/auth/phone-verifications/{verificationId}/confirm";
    "~^/api/auth/devices/[^/]+$" "/api/auth/devices/{userDeviceId}";
    "~^/api/accounts/[^/]+$" "/api/accounts/{accountId}";
    "~^/api/cards/[^/]+$" "/api/cards/{userCardId}";
}
map $http_upgrade $yamu_monitor_connection {
    default upgrade;
    '' close;
}
log_format yamu_monitor escape=json
    '{"route":"$yamu_monitor_route","method":"$request_method","status":$status,"duration":$request_time}';
