# http context only. Generated from route templates; no user values logged.
map $uri $yamu_monitor_route {
    default "/api/other";
    "~^/api/users/me/payment\\-settings$" "/api/users/me/payment-settings";
    "~^/api/auth/phone\\-verifications$" "/api/auth/phone-verifications";
    "~^/api/cashflow\\-payment\\-matches$" "/api/cashflow-payment-matches";
    "~^/api/auth/step\\-up/challenge$" "/api/auth/step-up/challenge";
    "~^/api/accounts/one\\-won\\-auth$" "/api/accounts/one-won-auth";
    "~^/api/forecasts/living\\-cost$" "/api/forecasts/living-cost";
    "~^/api/forecasts/simulations$" "/api/forecasts/simulations";
    "~^/api/auth/login/challenge$" "/api/auth/login/challenge";
    "~^/api/pos/payment\\-requests$" "/api/pos/payment-requests";
    "~^/api/accounts/candidates$" "/api/accounts/candidates";
    "~^/api/auth/step\\-up/verify$" "/api/auth/step-up/verify";
    "~^/api/merchant\\-categories$" "/api/merchant-categories";
    "~^/api/forecasts/settings$" "/api/forecasts/settings";
    "~^/api/forecasts/balance$" "/api/forecasts/balance";
    "~^/api/payments/barcodes$" "/api/payments/barcodes";
    "~^/api/payments/export$" "/api/payments/export";
    "~^/api/cashflow\\-items$" "/api/cashflow-items";
    "~^/api/auth/devices$" "/api/auth/devices";
    "~^/api/auth/refresh$" "/api/auth/refresh";
    "~^/api/cards/lookup$" "/api/cards/lookup";
    "~^/api/auth/logout$" "/api/auth/logout";
    "~^/api/cards/order$" "/api/cards/order";
    "~^/api/auth/login$" "/api/auth/login";
    "~^/api/merchants$" "/api/merchants";
    "~^/api/accounts$" "/api/accounts";
    "~^/api/auth/pin$" "/api/auth/pin";
    "~^/api/billings$" "/api/billings";
    "~^/api/payments$" "/api/payments";
    "~^/api/users/me$" "/api/users/me";
    "~^/api/refunds$" "/api/refunds";
    "~^/api/health$" "/api/health";
    "~^/api/cards$" "/api/cards";
    "~^/api/cashflow\\-items/[^/]+/payment\\-match\\-candidates$" "/api/cashflow-items/{cashflowItemId}/payment-match-candidates";
    "~^/api/auth/phone\\-verifications/[^/]+/confirm$" "/api/auth/phone-verifications/{verificationId}/confirm";
    "~^/api/cashflow\\-payment\\-matches/[^/]+$" "/api/cashflow-payment-matches/{matchId}";
    "~^/api/payments/barcodes/[^/]+$" "/api/payments/barcodes/{barcodeToken}";
    "~^/api/pos/payment\\-requests/[^/]+$" "/api/pos/payment-requests/{paymentId}";
    "~^/api/cashflow\\-items/[^/]+$" "/api/cashflow-items/{cashflowItemId}";
    "~^/api/payments/[^/]+/approve$" "/api/payments/{paymentId}/approve";
    "~^/api/auth/devices/[^/]+$" "/api/auth/devices/{userDeviceId}";
    "~^/api/payments/[^/]+/cancel$" "/api/payments/{paymentId}/cancel";
    "~^/api/payments/[^/]+/memo$" "/api/payments/{paymentId}/memo";
    "~^/api/admin/jobs/[^/]+/run$" "/api/admin/jobs/{jobName}/run";
    "~^/api/accounts/[^/]+$" "/api/accounts/{accountId}";
    "~^/api/payments/[^/]+$" "/api/payments/{paymentId}";
    "~^/api/cards/[^/]+$" "/api/cards/{userCardId}";
    "~^/api/billings/[^/]+$" "/api/billings/{billId}";
}
map $http_upgrade $yamu_monitor_connection {
    default upgrade;
    '' close;
}
log_format yamu_monitor escape=json
    '{"route":"$yamu_monitor_route","method":"$request_method","status":$status,"duration":$request_time}';
