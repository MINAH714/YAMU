apiVersion: 1
datasources:
  - name: YAMU Prometheus
    uid: yamu-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: YAMU Logs
    uid: yamu-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 500
