# Bootstrap configuration: install before requesting a certificate.
# Certbot later adds HTTPS listeners and HTTP redirection on the server.
server {
    listen 80;
    listen [::]:80;

    server_name yamu.it.kr;

    # Temporary response until the POS build is deployed.
    location / {
        default_type text/plain;
        return 200 "Web server is ready.\n";
    }

    location /api/ {
        # No trailing slash: preserve /api/ in the upstream request URI.
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
