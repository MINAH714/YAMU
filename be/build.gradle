plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yamu'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

// Boot 3.5 manages 11.7.2; align both Flyway modules for RDS MySQL 8.4.
ext['flyway.version'] = '11.20.3'

// 공개 취약점이 있는 라이브러리를 같은 줄의 최신 패치로 올린다(S15P31E103-368). Boot 3.5.16이 3.5대 최신이라 Boot만 올려서는 안 바뀐다.
// Boot를 올릴 때 Boot가 이 버전 이상을 관리하면 해당 줄을 지운다.
ext['tomcat.version'] = '10.1.61'          // 3.5.16 기본 10.1.55: Critical 5 · High 1 (10.1.59에서 모두 수정)
ext['jackson-bom.version'] = '2.21.8'      // 기본 2.21.4: High 5 (2.21.7에서 수정)
ext['netty.version'] = '4.1.140.Final'     // 기본 4.1.135(Redis 연결): Critical 1 · High 1 (4.1.137에서 수정)
ext['commons-lang3.version'] = '3.18.0'    // 기본 3.17.0: Moderate 1
ext['log4j2.version'] = '2.25.5'           // 기본 2.24.3(log4j-api만 씀): Moderate 1

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    // DB 접근은 JPA, 테이블 구조는 Flyway가 관리한다. data-jpa가 JDBC를 포함한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // PIN 해시용 BCrypt. 버전은 Boot가 관리한다.
    implementation 'org.springframework.security:spring-security-crypto'
    // 인증: Security + JWT 검증(Resource Server). 검증 필터는 Spring 것을 쓰고 토큰 → 사용자 변환과 에러 응답만 직접 둔다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // DB가 필요한 테스트는 Testcontainers로 MySQL을 잠깐 띄운다. Docker가 없으면 그 테스트만 건너뛴다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply from: 'gradle/six-month-results.gradle'

tasks.register('testSixMonthResultGate') {
    group = 'verification'
    description = 'Test the experiment result gate using synthetic reports, without running the experiment.'
    doLast {
        new GroovyShell(this.class.classLoader, new Binding([
            verifyResult: project.ext.verifySixMonthResults, tempRoot: temporaryDir
        ])).evaluate(file('gradle/test-six-month-results.gradle'))
    }
}

tasks.named('test') {
    // The opt-in local HTTP preview runs only through seed/qa/local-app.init.gradle.
    exclude 'com/yamu/be/seed/qa/QaLocalAppTest.class'
    dependsOn tasks.named('testSixMonthResultGate')
    useJUnitPlatform {
        // 승인형 본 실험은 별도 태스크에서만 선택한다. 사전 경계 검사는 그대로 실행한다.
        excludeTags 'six-month-approved-experiment'
    }
    // 테스트는 개인 로컬 설정(application-local.yml) 대신 src/test/resources/application-test.yml을 쓴다.
    systemProperty 'spring.profiles.active', 'test'
}

def experimentExecution = [result: null]
def experimentResultGate = tasks.register('verifySixMonthExperimentResult') {
    group = 'verification'
    description = 'Reject skipped, missing, stale or unsuccessful approved experiment results.'
    doLast {
        def experiment = tasks.named('sixMonthExperiment', Test).get()
        project.ext.verifySixMonthResults(experiment.reports.junitXml.outputLocation.get().asFile, experimentExecution.result)
    }
}

tasks.register('sixMonthExperiment', Test) {
    finalizedBy experimentResultGate
    group = 'verification'
    description = 'Run the explicitly approved EXP-006 six-month comparison.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'six-month-approved-experiment'
    }
    systemProperty 'spring.profiles.active', 'test'
    // 승인된 재실행은 매번 새 결과를 만든다. 이전 성공으로 승인 검사를 우회하지 않는다.
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('An approved experiment must execute on every invocation') { true }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            experimentExecution.result = [total: result.testCount, failed: result.failedTestCount, skipped: result.skippedTestCount]
        }
    }
    doFirst {
        if (System.getenv('YAMU_EXP006_EXECUTE') != 'APPROVED_6_MONTHS_V1') {
            throw new GradleException('sixMonthExperiment requires YAMU_EXP006_EXECUTE=APPROVED_6_MONTHS_V1; no experiment was started.')
        }
    }
}

tasks.register('seedLocal', JavaExec) {
    group = 'application'
    description = 'Load the explicit local development seed.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.yamu.be.seed.LocalSeedLoader'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    args file('seed').absolutePath
    if (project.hasProperty('resetSeed')) { args '--reset' }
    if (project.hasProperty('catalogOnlySeed')) { args '--catalog-only' }
}
