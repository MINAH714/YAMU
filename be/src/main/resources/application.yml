spring:
  application:
    name: yamu-be
  jackson:
    # JSON 필드 이름은 Java 필드 이름 그대로(camelCase)다. 별도 naming 설정을 두지 않는다.
    # 날짜는 ISO-8601 문자열("2026-10-20T10:00:00")로 내려간다(Spring Boot 기본값).
    time-zone: Asia/Seoul
server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
