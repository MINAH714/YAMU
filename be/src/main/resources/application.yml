spring:
  application:
    name: yamu-be
  profiles:
    # 프로필을 따로 지정하지 않으면 local로 실행한다(application-local.yml을 읽는다).
    # 운영 서버는 SPRING_PROFILES_ACTIVE 환경변수로 따로 지정한다.
    default: local
  jackson:
    # JSON 필드 이름은 Java 필드 이름 그대로(camelCase)다. 별도 naming 설정을 두지 않는다.
    # 날짜는 ISO-8601 문자열로 내려간다(Spring Boot 기본값). 시간은 UTC 기준이다.
    # LocalDateTime은 끝에 Z를 붙여 내보낸다(UtcLocalDateTimeSerializer).
    time-zone: UTC
  task:
    scheduling:
      pool:
        # 정기 작업 스레드. @Scheduled 작업 수(9개, 실적 부족 알림 S15P31E103-465 포함)만큼 둬서 서로 기다리지 않게 한다(S15P31E103-477).
        # 모자라면 07:00 청구 출금·08:30 잔고·실적 알림 같은 긴 작업이 스레드를 잡는 동안 결제 복구가 밀려,
        # 출금 미확인 재대조 창(late-withdrawal-window)을 놓칠 수 있다. 작업을 늘리면 이 값도 올린다(ScheduledPoolSizeTest가 확인)
        size: 9
  jpa:
    # 트랜잭션이 끝난 뒤(Controller·JSON 변환 중)에 지연 로딩 쿼리가 몰래 나가지 않게 끈다.
    # 화면에 필요한 값은 Service의 트랜잭션 안에서 DTO로 옮겨 담아 반환한다.
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)가 만든다. JPA는 엔티티와 테이블이 맞는지 검사만 하고,
      # 다르면 서버가 뜨지 않는다. create·update는 운영 DB 구조를 멋대로 바꾸므로 쓰지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        # 연관 엔티티를 하나씩 N번 조회하지 않고 IN (...)으로 최대 100개씩 묶어 조회한다(N+1 안전망).
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  flyway:
    # 마이그레이션 SQL 위치(기본값). 파일 규칙은 docs/be/jpa-flyway.md
    locations: classpath:db/migration
    # 번호가 더 작은 파일이 늦게 머지돼도 적용한다(S15P31E103-345). 끄면 마지막 적용 번호보다 작은 새 파일을 만나
    # 서버가 뜨지 않는다. 여러 명이 동시에 머지해서 번호 순서와 머지 순서가 어긋날 수 있기 때문이다.
    out-of-order: true
server:
  port: ${SERVER_PORT:8080}
  # Nginx 뒤에서 X-Forwarded-For의 실제 접속 IP를 쓴다(인증 기록의 ip_address). Tomcat은 내부망(127.0.0.1 등)에서 온 헤더만 믿는다.
  forward-headers-strategy: native

yamu:
  # 개인정보 암호화·조회 해시·PIN 해시 키(Base64). 운영은 환경변수로, 로컬은 application-local.yml에 넣는다.
  # 비어 있거나 길이가 틀리거나 서로 같으면 서버가 뜨지 않는다(CryptoKeys).
  # 키를 잃으면 암호화된 값을 열 수 없고, hmac-key·pin-pepper를 바꾸면 기존 해시가 전부 맞지 않는다.
  # 사용법·키 만드는 법: docs/be/personal-data-crypto.md
  crypto:
    data-key-id: ${YAMU_CRYPTO_DATA_KEY_ID:1}
    data-keys:
      "[1]": ${YAMU_CRYPTO_DATA_KEY_1:}
    hmac-key: ${YAMU_CRYPTO_HMAC_KEY:}
    pin-pepper: ${YAMU_CRYPTO_PIN_PEPPER:}
  # Access Token(JWT HS256). secret은 32바이트 이상 Base64. 운영은 환경변수, 로컬은 application-local.yml.
  jwt:
    secret: ${YAMU_JWT_SECRET:}
    access-token-ttl: 30m
  # 로그인 정책(노션 명세: challenge 60초, 5회 실패 30분 잠금, Refresh 14일)
  auth:
    challenge-ttl: 60s
    refresh-token-ttl: 14d
    # 재발급 직후 직전 토큰이 다시 와도 탈취로 보지 않는 시간(앱의 동시 재발급, 응답이 끊긴 뒤 재시도 대비).
    # 앱의 응답 대기 시간(read 15초)보다 길어야 응답을 못 받은 앱의 재시도가 탈취로 보이지 않는다(S15P31E103-352)
    refresh-reuse-grace: 60s
    max-failed-attempts: 5
    lock-duration: 30m
    # 본인 인증(step-up) 토큰. 5분 안에 한 번만 쓸 수 있다(명세 5장)
    step-up-token-ttl: 5m
    # 로그인 준비·로그인 호출 횟수 제한(두 API 합산). 넘으면 429 TOO_MANY_REQUESTS
    rate-limit:
      window: 1m
      per-device: 10
      per-ip: 60
    # 휴대폰 본인인증(연출)과 가입 진행 토큰(노션 명세 「휴대폰 본인인증 요청·확인」). 회원가입 API는 없음(시드 사용자만 가입)
    signup:
      verification-ttl: 3m
      resend-interval: 1m
      max-code-attempts: 5
      token-ttl: 30m
      # 문자를 보내지 않으므로 인증번호를 응답(demoCode)으로 내려준다. 문자 서비스를 붙이면 false
      expose-demo-code: true
      # 본인인증 요청·확인을 합쳐 같은 IP로 1분(rate-limit.window)에 30번까지. 시연장 와이파이를 생각해 넉넉히 둔다
      per-ip: 30
  # 계좌 연결(노션 명세 「계좌 확인」「1원 인증 요청」「계좌 연결」). 1원 인증 유효시간은 SSAFY 문서에 없어 실측(5분 성공·10분 만료)으로 5분 안내
  account-link:
    verification-ttl: 10m
    auth-code-validity: 5m
    resend-interval: 1m
    max-code-attempts: 3
    auth-text: YAMU
    idempotency-ttl: 24h
    # 같은 Idempotency-Key를 처리 중이라고 표시해 두는 시간. 금융망 두 번(코드 확인·잔액, 각 10초)보다 길게
    idempotency-lock-ttl: 30s
    # 1원 인증 남용 막기(한국 날짜 기준, 자정에 초기화). 계좌마다 하루 5번 발송, 10번 틀리면 그날은 잠금
    daily-send-limit: 5
    daily-fail-limit: 10
    # 기기 재등록 1원은 하루 3회(일반 5회보다 낮게). 재등록은 1원 인증이 계정을 넘겨주는 유일한 확인이라서
    recovery-daily-send-limit: 3
    # 임시(S15P31E103-350): 1원 응답에 인증 숫자(demoCode)를 내려준다. 시연 계좌는 SSAFY 금융망에만 있어 사용자가 거래내역을
    # 볼 수 없어서다. 켜면 1원 인증이 계좌 주인 확인이 되지 않으므로 실제 계좌를 쓰게 되면 false
    expose-demo-code: true
  # 계좌 잔액 조회(노션 명세 「계좌 목록 조회」). 계좌 목록 화면과 잔고예보가 같은 캐시를 쓴다
  account-balance:
    cache-ttl: 10m
    # 캐시에 없는 계좌는 금융망에 동시에 묻는다(최대 5개). 조회 전체 기한 10초를 넘기면 끝나지 않은 계좌는 결과 불명(504)
    max-parallel: 5
    overall-timeout: 10s
    # 사용자별 refresh=true(캐시 건너뛰기) 1분 한도. 넘으면 429
    refresh-per-minute: 6
  # 탈퇴 뒤 재가입 열쇠 정리(S15P31E103-380, 임시 정책 11/9): 탈퇴하고 30일이 지나면 휴대폰 해시·생년월일·이름 해시·SSAFY 회원 정보·
  # 카드번호를 지운다. 그 뒤 같은 사람은 새 회원으로 가입한다. 수동 실행: POST /api/admin/jobs/withdrawn-key-purge/run
  user:
    withdrawn-key-purge:
      enabled: true
      retention: 30d
      cron: "0 30 3 * * *"
  # 카드 이미지 공개 CDN. DB에는 전체 URL 대신 객체 키만 저장한다.
  card-image:
    base-url: ${YAMU_CARD_IMAGE_BASE_URL:https://d2yc4hwyx55emn.cloudfront.net}
  # 카드 등록 정책(노션 명세 「카드 확인」「카드 등록」)
  card-register:
    verification-ttl: 5m
    # 사용자별 카드 확인 호출 한도(1분). 넘으면 429 TOO_MANY_REQUESTS
    lookup-per-minute: 5
  # 모의 POS(노션 명세 「POS 결제 요청 생성」). POS 설정은 서버가 관리하고 새 테이블은 두지 않는다(10/26 결정, 임시: yml).
  # key는 POS 웹이 보내는 X-POS-Key. 운영은 환경변수 YAMU_POS_KEY, 로컬은 application-local.yml. 비어 있으면 POS를 쓸 수 없다
  pos:
    key: ${YAMU_POS_KEY:}
    # 사용자가 승인해야 하는 시간(DEC-003). 바코드 유효 60초와 별개로 POS 요청 뒤 60초
    confirm-window: 60s
    # 스캔된 바코드·추천 스냅샷을 Redis에 두는 시간. 마감 뒤에도 앱이 상태를 볼 수 있게 마감보다 길게(스냅샷 위치는 Q20)
    scanned-retention: 10m
    snapshot-ttl: 10m
    idempotency-ttl: 24h
    # 같은 Idempotency-Key를 처리 중이라고 표시해 두는 시간. 추천 계산(10초 목표)보다 길게
    idempotency-lock-ttl: 15s
    # posCode별 시나리오. brand-code는 merchant.brand_code(시드), facility-type은 입점 시설 10종. 모르면 facility-type을 비운다
    terminals:
      - pos-code: POS-STARBUCKS-GENERAL
        brand-code: STARBUCKS
        channel: OFFLINE
        facility-type: GENERAL
      - pos-code: POS-STARBUCKS-DEPARTMENT_STORE
        brand-code: STARBUCKS
        channel: OFFLINE
        facility-type: DEPARTMENT_STORE
      - pos-code: POS-YAMU-CAFE
        brand-code: YAMU_TEST_CAFE
        channel: OFFLINE
        facility-type: GENERAL
      - pos-code: POS-GS25-GENERAL
        brand-code: GS25
        channel: OFFLINE
        facility-type: GENERAL
  # 결제 승인(노션 명세 「결제 승인 요청 (카드 확정)」). 확정 마감 60초는 pos.confirm-window를 같이 쓴다
  payment:
    approve:
      idempotency-ttl: 24h
      # 같은 Idempotency-Key를 처리 중이라고 표시해 두는 시간. 체크카드 출금(금융망 호출 10초)보다 길게
      idempotency-lock-ttl: 30s
      # 같은 결제에 다른 키 요청이 겹칠 때 시도 예약~PROCESSING 선점을 한 줄로 세우는 잠금. DB 트랜잭션 하나보다 길게
      start-lock-ttl: 5s
      # 거절 뒤 다른 카드로 다시 승인할 수 있는 횟수(임시: 명세 v0.3.1 가정 3회)와 시도 기록 보관 시간
      max-attempts: 3
      attempt-ttl: 24h
      # 결제 하나의 출금 실행·결과 저장·복구가 겹치지 않게 잡는 잠금. 금융망 응답 제한(10초)보다 넉넉히
      settle-lock-ttl: 60s
      # 결과를 모르는 출금(타임아웃 등)을 거래내역에 없다고 결론내기 전 유예(임시: 응답 제한의 3배). 그 뒤에도 금융망이 늦게 처리하면 운영이 태그로 대조한다
      recovery-grace: 30s
      # 결과 불명 PROCESSING 결제를 훑는 주기 작업(명세 「결제 상태·예외 처리」 Q5 제안, 임시)
      recovery-interval: 60s
      # 주기 작업이 판정하지 못한 결제(금액 불일치·조회 실패 등)를 다시 보기까지 건너뛰는 시간
      recovery-hold: 5m
      # 출금 미확인으로 거절·만료한 결제를 다시 대조하는 기간(임시: 은행의 늦은 처리 대비, 요청 번호 시각 기준)
      late-withdrawal-window: 10m
      # 기본은 끔. 운영은 PAYMENT_RECOVERY_ENABLED=true로 켠다(로컬에서 돌지 않게)
      recovery-enabled: ${PAYMENT_RECOVERY_ENABLED:false}
  # SSAFY 금융망. api-key는 운영은 환경변수 SSAFY_API_KEY, 로컬은 application-local.yml에 넣는다(노션 API 명세 4장).
  # 키·userKey·요청 본문은 로그에 남기지 않는다. 비어 있어도 서버는 뜨고, 금융망을 부르는 순간 실패한다.
  fin-api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1
    api-key: ${SSAFY_API_KEY:}
    # 연결 3초를 넘으면 "요청 안 감", 응답 10초를 넘으면 "결과 불명"으로 본다(FinApiClient)
    connect-timeout: 3s
    read-timeout: 10s
  # AI 생활비 예측 서버(ai/README.md 「생활비 예측 API」). 운영은 환경변수 AI_BASE_URL(예: http://ai:8001).
  # 비어 있으면 부르지 않고 TSB로 계산한다. 연결·응답 각각 1초를 넘거나 응답이 계약과 다르면 그 요청을 TSB로 계산한다.
  ai:
    base-url: ${AI_BASE_URL:}
    connect-timeout: 1s
    read-timeout: 1s
    # 시간 초과·연결 실패·서버 오류 뒤 이 시간 동안은 부르지 않고 바로 TSB(장애 중 요청마다 기다리지 않게)
    failure-pause: 30s
  # 공휴일 동기화(공공데이터포털 「한국천문연구원_특일 정보」, docs/be/holiday.md). service-key는 디코딩 키를 넣는다(호출할 때 한 번 인코딩. 인코딩 키를 넣으면 경고를 남기고 한 번 풀어서 쓴다).
  # 운영은 환경변수 DATA_GO_KR_SERVICE_KEY, 로컬은 application-local.yml. 비어 있으면 동기화를 건너뛰고 내장 파일로만 영업일을 센다.
  # 키·응답 본문은 로그에 남기지 않는다.
  holiday:
    base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
    # 매일 04:00(한국 시간). 청구 확정(00:30) 뒤, 청구 출금(07:00) 전
    sync-cron: "0 0 4 * * *"
  # 신용카드 청구 정기 작업(API 명세 V2 4장). 시각은 한국 시간. 기본은 끔이고 운영은 BILLING_JOBS_ENABLED=true로 켠다.
  # 수동 실행(POST /api/admin/jobs/{jobName}/run)은 이 값과 상관없이 돈다.
  billing:
    # 청구 확정: 매일 00:30. 이용기간 마감이 지난 진행 중 청구서를 확정한다
    confirm-cron: "0 30 0 * * *"
    # 청구 출금: 매일 07:00. 출금일이 지난 확정 청구서를 YAMU-B 태그로 출금한다(공휴일 동기화 04:00 뒤)
    withdraw-cron: "0 0 7 * * *"
    # 결과를 모르는 청구 출금을 거래내역으로 확인·재시도하는 주기. 새 출금은 07:00에만 한다. 유예는 payment.approve.recovery-grace를 같이 쓴다
    withdraw-recovery-interval: 10m
    # 환급 입금(refund-payout): 매일 09:00, 청구 출금(07:00) 뒤. 기한이 정해진 대기 환급을 입금한다.
    # 결과 불명 입금의 유예는 yamu.payment.approve.recovery-grace를 같이 쓴다
    refund-payout-cron: "0 0 9 * * *"
    jobs-enabled: ${BILLING_JOBS_ENABLED:false}
  # 앱 내 알림(Task 9.3.2). 거래 알림은 결제·청구 사건 커밋 뒤에 바로 쌓고, 잔고 위험은 정기 작업이 판정한다.
  # 기본은 끔이고 운영은 NOTIFICATION_JOBS_ENABLED=true로 켠다. 수동 실행(POST /api/admin/jobs/balance-risk-notify/run)은 이 값과 상관없이 돈다.
  notification:
    # 잔고 위험(balance-risk-notify): 매분 깨어 잔고 알림 시각(balanceTime, 기본 08:30)이 지났고 오늘 판정하지 않은 사용자를 판정한다
    balance-risk-cron: "0 * * * * *"
    jobs-enabled: ${NOTIFICATION_JOBS_ENABLED:false}
  # 운영 API(X-Admin-Key). 운영은 환경변수 YAMU_ADMIN_KEY, 로컬은 application-local.yml. 비어 있으면 운영 API는 모두 403
  admin:
    key: ${YAMU_ADMIN_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

---
# local 프로필에만 적용되는 공통 개발 설정. 개인 값(DB 비밀번호 등)은 application-local.yml에 둔다.
# 여기 두는 이유: 이미 application-local.yml을 복사해 둔 팀원도 견본을 다시 복사하지 않고 받게 하려고.
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    # 실행되는 SQL을 콘솔에 찍는다. 반복문에서 같은 SELECT가 줄줄이 나오면 N+1이다.
    org.hibernate.SQL: debug
