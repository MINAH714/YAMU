# 테스트 전용 설정. build.gradle의 test 태스크가 test 프로필로 실행한다.
# 기본 테스트는 DB·Redis가 떠 있지 않아도 돌아가야 한다.
#  - Flyway는 기동할 때 DB에 접속하므로 끈다.
#  - Hibernate도 기동할 때 DB에서 버전 정보를 읽으려 하므로, 방언을 지정하고 접속하지 않게 한다.
# DB가 필요한 테스트는 MySqlTestSupport를 상속하면 Testcontainers MySQL로 위 설정을 덮어쓴다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yamu_test
    username: test
    password: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        boot:
          allow_jdbc_metadata_access: false
yamu:
  # 테스트 전용 키. 실제 데이터에 쓰지 않는다.
  crypto:
    data-key-id: 1
    data-keys:
      "[1]": 0EnDNJY8EiCQDK78eTZI238tmQcubOUaUQovAddqKuU=
    hmac-key: W6990e8xM9l51TNQdCULcgsTC3Z8cE1F9KAykAubMsY=
    pin-pepper: 21zmotCRVO8RYY0N3gWiHctx+Sb9BSjCwaZZL+4K4Do=
  jwt:
    secret: QtMBagkzR6RDQxrKVCjsIIbWYns3aRMksLkC+dwPfro=
  # 모의 POS 테스트 설정. 시나리오의 brand-code는 테스트가 merchant 행으로 직접 넣는다
  pos:
    key: test-pos-key
    confirm-window: 60s
    scanned-retention: 10m
    snapshot-ttl: 10m
    idempotency-ttl: 24h
    idempotency-lock-ttl: 15s
    terminals:
      - pos-code: POS-TEST-CAFE
        brand-code: TEST_CAFE
        channel: OFFLINE
        facility-type: GENERAL
      - pos-code: POS-TEST-CAFE-DEPT
        brand-code: TEST_CAFE
        channel: OFFLINE
        facility-type: DEPARTMENT_STORE
      - pos-code: POS-TEST-SHOP
        brand-code: TEST_SHOP
        channel: ONLINE
