# 로컬 개발용 MySQL·Redis. 운영 배포용 Compose(INFRA)와는 별개다.
# be 폴더에서 `docker compose up -d`로 띄운다. 자세한 사용법은 docs/be/local-setup.md.
#
# 값을 바꾸고 싶으면 be/.env에 같은 이름으로 적는다(.env는 깃에 올라가지 않는다).
# 포트·비밀번호를 바꿨다면 application-local.yml의 값도 똑같이 맞춰야 BE가 붙는다.
name: yamu-local

services:
  mysql:
    image: mysql:8.4.11
    container_name: yamu-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-yamu}
      MYSQL_USER: ${DB_USERNAME:-yamu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yamu_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    # 시간대는 따로 지정하지 않는다(UTC). 운영 Lightsail Managed MySQL 기본값과 같게 둔다.
    # 127.0.0.1에만 열어 같은 와이파이의 다른 기기에서 접속하지 못하게 한다.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 첫 실행 때 MySQL은 초기화용 임시 서버를 네트워크 없이 띄운다.
    # TCP(127.0.0.1)로 ping해야 초기화가 끝난 진짜 서버가 뜬 뒤에 healthy가 된다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: yamu-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# 컨테이너를 지웠다 다시 만들어도 데이터가 남는다. 완전히 비우려면 `docker compose down -v`.
volumes:
  mysql_data:
  redis_data:
