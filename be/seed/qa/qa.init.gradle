// Explicit CLI only: no application context, scheduler, or automatic migration.
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            tasks.register('seedQa', JavaExec) {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.yamu.be.seed.qa.QaSeedCli'
                systemProperty 'file.encoding', 'UTF-8'
                systemProperty 'user.timezone', 'UTC'
                args providers.gradleProperty('qaCommand').getOrElse('plan')
                args providers.gradleProperty('qaFile').getOrElse('seed/qa/personas.local.json')
            }
            tasks.register('planQaLife', JavaExec) {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.yamu.be.seed.qa.QaLifePlanCli'
                systemProperty 'file.encoding', 'UTF-8'
                systemProperty 'user.timezone', 'UTC'
            }
            tasks.register('prepareQaAccounts', JavaExec) {
                group = 'application'
                description = 'Explicit QA550 account preparation; never runs during test/check/build.'
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.yamu.be.seed.qa.QaAccountPrepareCli'
                systemProperty 'file.encoding', 'UTF-8'
                systemProperty 'user.timezone', 'UTC'
                standardInput = System.in
                args providers.gradleProperty('qaPrepareCommand').getOrElse('plan')
                args providers.gradleProperty('qaSeedDirectory').getOrElse('seed/qa')
                args providers.gradleProperty('qaDeviceManifest').getOrElse('seed/qa/devices.local.json')
                if (providers.gradleProperty('qaPrepareReceipt').isPresent()) {
                    args providers.gradleProperty('qaPrepareReceipt').get()
                }
            }
        }
    }
}

allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            tasks.register('seedQaAssets', JavaExec) {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.yamu.be.seed.qa.QaAssetHistoryCli'
                systemProperty 'file.encoding', 'UTF-8'
                systemProperty 'user.timezone', 'UTC'
                args providers.gradleProperty('qaCommand').getOrElse('plan')
                args providers.gradleProperty('qaFile').getOrElse('seed/qa/assets.local.json')
            }
        }
    }
}
